<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matunga</title>
  <style>
    :root {
      --bg-low-0: #0b0b0a;
      --bg-low-1: #241814;
      --green: #1f8f5f;
      --red: #6e1717;
      --ui-0: #171615;
      --ui-1: #241814;
      --ui-2: #34231d;
      --ui-3: #6f5038;
      --txt: #e6d6bd;
      --txt-soft: #b8a48c;
      --a: #d59b45;
      --b: #69d49a;
      --time-fast: 160ms;
      --time-mid: 220ms;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--txt);
      background:
        radial-gradient(circle at 18% 12%, rgba(31, 143, 95, 0.10), transparent 42%),
        radial-gradient(circle at 82% 10%, rgba(110, 23, 23, 0.10), transparent 38%),
        linear-gradient(155deg, #0f0e0d 0%, #171312 42%, #1b1310 100%);
      background-image:
        radial-gradient(circle at 18% 12%, rgba(31, 143, 95, 0.10), transparent 42%),
        radial-gradient(circle at 82% 10%, rgba(110, 23, 23, 0.10), transparent 38%),
        linear-gradient(155deg, #0f0e0d 0%, #171312 42%, #1b1310 100%),
        radial-gradient(circle, rgba(255, 255, 255, 0.03) 0.6px, transparent 0.8px);
      background-size: auto, auto, auto, 6px 6px;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.52;
    }

    #root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: clamp(14px, 2.2vw, 24px);
    }

    #title {
      grid-column: 1 / -1;
      grid-row: 1;
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      letter-spacing: 0.1em;
      color: var(--txt);
      font-size: clamp(1.45rem, 2.8vw, 2.45rem);
      line-height: 1.08;
      position: relative;
      width: fit-content;
      user-select: none;
      text-transform: uppercase;
    }

    #title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      transform: translate(2px, 1px);
      color: #6e1717;
      opacity: 0.24;
      pointer-events: none;
    }

    #arena {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      place-items: center;
      min-height: min(740px, 80vh);
    }

    #board {
      width: min(92vw, 560px);
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 8px;
      background: #171615;
      border: 1px solid #6f5038;
      border-radius: 10px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.34);
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      border: 1px solid #34231d;
      background: #241814;
      color: #d8cfc8;
      font-size: clamp(1rem, 2.8vw, 1.42rem);
      cursor: pointer;
      transition:
        transform var(--time-fast) ease,
        box-shadow var(--time-fast) ease,
        border-color var(--time-fast) ease,
        opacity var(--time-fast) ease;
      will-change: transform;
    }

    .cell:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 19%;
      border-radius: 50%;
      opacity: 0;
      transition: opacity var(--time-mid) ease, filter var(--time-mid) ease;
      filter: blur(6px);
      pointer-events: none;
    }

    .cell.piece-a::before {
      background: rgba(213, 155, 69, 0.52);
      opacity: 0.55;
    }

    .cell.piece-b::before {
      background: rgba(31, 143, 95, 0.52);
      opacity: 0.55;
    }

    .cell.selected {
      outline: 2px solid #69d49a;
      outline-offset: -2px;
      animation: selectedPulse 1.1s ease-in-out infinite;
    }

    .cell.valid::after {
      content: "";
      width: 11px;
      height: 11px;
      background: #b8a48c;
      transform: rotate(45deg);
      opacity: 0.85;
      border-radius: 1px;
      box-shadow: 0 0 6px rgba(184, 164, 140, 0.3);
      pointer-events: none;
    }

    .cell.win {
      border: 2px solid var(--win-color, #d59b45);
      animation: winGlow 700ms ease-in-out infinite alternate;
    }

    .cell.move-from {
      transform: scale(0.95);
      opacity: 0.74;
    }

    .cell.move-to {
      transform: scale(1.06);
      box-shadow: 0 0 0 1px rgba(230, 214, 189, 0.25), 0 6px 14px rgba(0, 0, 0, 0.34);
    }

    .coord {
      position: absolute;
      right: 3px;
      bottom: 2px;
      font-size: 8px;
      color: #73625a;
      pointer-events: none;
    }

    #hud {
      grid-column: 2;
      grid-row: 2;
      width: min(330px, 94vw);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      align-content: start;
    }

    #controls,
    #status,
    #history {
      background: #171615;
      border: 1px solid #34231d;
      border-radius: 8px;
    }

    #controls {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    #controls .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    #controls label {
      font-size: 0.76rem;
      color: #b8a48c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    select, button {
      height: 34px;
      background: #241814;
      border: 1px solid #6f5038;
      color: #e6d6bd;
      border-radius: 6px;
      font-size: 0.86rem;
      padding: 0 10px;
      transition: border-color var(--time-fast) ease, box-shadow var(--time-fast) ease, transform var(--time-fast) ease;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: #d59b45;
      box-shadow: 0 0 8px rgba(213, 155, 69, 0.24);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      padding: 10px;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 0.94rem;
      line-height: 1.42;
      color: #b8a48c;
      min-height: 72px;
    }

    #status .a { color: #d59b45; }
    #status .b { color: #69d49a; }
    #status .warn { color: #c18080; }

    #history {
      padding: 10px 8px 10px 12px;
      min-height: 180px;
      max-height: min(58vh, 420px);
      overflow: auto;
    }

    #history ol {
      margin: 0;
      padding-left: 18px;
      color: #b8a48c;
      font-size: 0.82rem;
      line-height: 1.58;
    }

    #history li.latest {
      color: #e6d6bd;
    }

    #history strong {
      color: #d7c4a8;
    }

    #history::-webkit-scrollbar { width: 8px; }
    #history::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #6f5038, #34231d);
      border-radius: 8px;
    }

    @keyframes selectedPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }

    @keyframes winGlow {
      from { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
      to { box-shadow: 0 0 14px rgba(213, 155, 69, 0.38); }
    }

    @media (max-width: 980px) {
      #root {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      #title { grid-column: 1; grid-row: 1; }
      #arena { grid-column: 1; grid-row: 2; min-height: auto; }
      #hud { grid-column: 1; grid-row: 3; width: 100%; }
      #board { width: min(96vw, 560px); }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div id="root">
    <header id="title" data-text="MATUNGA">MATUNGA</header>

    <section id="arena">
      <div id="board" aria-label="Tabuleiro Matunga"></div>
    </section>

    <aside id="hud">
      <div id="controls">
        <div class="row">
          <label for="mode">Modo</label>
          <select id="mode">
            <option value="pvp">🧑 vs 🧑</option>
            <option value="pvb-easy">🧑 vs 🤖 (fácil)</option>
            <option value="pvb-medium">🧑 vs 🤖 (médio)</option>
            <option value="pvb-hard">🧑 vs 🤖 (difícil)</option>
            <option value="bvb">🤖 vs 🤖</option>
          </select>
        </div>
        <div class="row">
          <button id="new-game">Novo jogo</button>
          <button id="undo">Desfazer (1×)</button>
        </div>
      </div>
      <div id="status"></div>
      <div id="history"></div>
    </aside>
  </div>

  <script src="./matunga.js"></script>
</body>
</html>
