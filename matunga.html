<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matunga</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --bg0: #1b1206;
      --bg1: rgba(38, 27, 11, 0.8);
      --bg2: #32240f;
      --bg3: #3f2d12;
      --bd: #5e4820;
      --bd2: #83642d;
      --tx0: #f8eecf;
      --tx1: #d8c79c;
      --tx2: #9f8852;
      --acc: #d7a928;
      --uni: #ffd56a;
      --hor: #71cf6e;
      --win: #9ae98e;
      --ok: #a6eb83;
      --danger: #ffab74;
      --glow-gold: rgba(215, 169, 40, 0.3);
      --glow-green: rgba(113, 207, 110, 0.24);
    }
    body {
      background:
        radial-gradient(circle at 15% 15%, rgba(215, 169, 40, 0.17), transparent 44%),
        radial-gradient(circle at 85% 10%, rgba(113, 207, 110, 0.13), transparent 38%),
        linear-gradient(180deg, #1a1207, #120b04 75%);
      color: var(--tx0);
      min-height: 100vh;
      overflow-x: hidden;
    }
    #fx-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.78;
    }
    .fx-aurora {
      position: fixed;
      inset: -10% -12%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(215, 169, 40, 0.16), transparent 34%),
        radial-gradient(circle at 80% 15%, rgba(113, 207, 110, 0.15), transparent 33%),
        radial-gradient(circle at 50% 100%, rgba(255, 173, 84, 0.08), transparent 45%);
      animation: auroraShift 18s ease-in-out infinite alternate;
      filter: blur(12px);
    }
    main.container {
      position: relative;
      z-index: 2;
    }
    .glass {
      background: linear-gradient(135deg, rgba(53, 38, 15, 0.88), var(--bg1));
      border: 1px solid var(--bd);
      border-radius: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 220, 130, 0.08);
      backdrop-filter: blur(8px);
    }
    .text-soft { color: var(--tx1); }
    .badge-soft {
      background: var(--bg2);
      border: 1px solid var(--bd2);
      color: var(--tx1);
      font-weight: 500;
      box-shadow: inset 0 0 0 1px rgba(255, 224, 140, 0.09);
    }
    h1.h2 {
      background: linear-gradient(120deg, #ffe5a0, #f5c24f 55%, #aadf79);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(255, 210, 90, 0.16);
    }
    .btn-theme {
      border-color: #9c7a32;
      color: #ffe2a2;
      background: linear-gradient(180deg, #4b3818, #35260f);
    }
    .btn-theme:hover {
      color: #fff0c7;
      border-color: #d3a84a;
      box-shadow: 0 0 0 0.2rem rgba(215, 169, 40, 0.2);
    }
    .btn-undo {
      border-color: #7ba65f;
      color: #d1f3b4;
      background: linear-gradient(180deg, #2c3a1f, #222f19);
    }
    .btn-undo:hover {
      color: #e7ffd4;
      border-color: #93cb70;
      box-shadow: 0 0 0 0.2rem rgba(113, 207, 110, 0.2);
    }
    #mode {
      border-color: var(--bd2);
      background-color: #2f220f !important;
      color: var(--tx0) !important;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      background: var(--bg3);
      border: 1px solid var(--bd2);
      border-radius: 12px;
      padding: 8px;
      width: min(100%, 440px);
      box-shadow: inset 0 0 0 1px rgba(255, 220, 130, 0.09);
    }
    .cell {
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: linear-gradient(180deg, #3a2910, #2d200d);
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: clamp(1rem, 3vw, 1.5rem);
      transition: .16s ease;
    }
    .cell:hover { transform: translateY(-1px); }
    .cell.uni {
      background: linear-gradient(180deg, #4e3816, #3c2b11);
      border-color: #9d792f;
      box-shadow: inset 0 0 12px rgba(255, 213, 106, 0.15);
    }
    .cell.hor {
      background: linear-gradient(180deg, #243c1d, #1d2f18);
      border-color: #4b8850;
      box-shadow: inset 0 0 12px rgba(113, 207, 110, 0.16);
    }
    .cell.select {
      outline: 2px dashed var(--acc);
      outline-offset: -3px;
      box-shadow: 0 0 0 3px rgba(215, 169, 40, 0.2);
    }
    .cell.valid {
      border-color: var(--ok);
      box-shadow: inset 0 0 0 1px rgba(166, 235, 131, 0.4), 0 0 12px rgba(113, 207, 110, 0.24);
    }
    .cell.win {
      border-color: var(--win);
      box-shadow: inset 0 0 0 1px rgba(154, 233, 142, 0.55), 0 0 22px rgba(154, 233, 142, 0.42);
      animation: pulse 1s infinite;
    }
    .coord {
      position: absolute;
      right: 5px;
      bottom: 2px;
      font-size: 9px;
      color: var(--tx2);
    }
    .history {
      max-height: 360px;
      overflow: auto;
      color: var(--tx1);
      line-height: 1.6;
      margin-bottom: 0;
    }
    .history::-webkit-scrollbar { width: 8px; }
    .history::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #87652b, #3a2b12);
      border-radius: 8px;
    }
    .status .u { color: var(--uni); }
    .status .h { color: var(--hor); }
    .status .ok { color: var(--ok); }
    .status .warn { color: var(--danger); }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); filter: brightness(1.16); }
      100% { transform: scale(1); }
    }
    @keyframes auroraShift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(0, -14px, 0) scale(1.03); }
    }
  </style>
</head>
<body>
  <canvas id="fx-particles"></canvas>
  <div class="fx-aurora"></div>
  <main class="container py-4 py-md-5">
    <section class="glass p-3 p-md-4 mb-3">
      <h1 class="h2 fw-bold mb-1">Matunga</h1>
      <p class="text-soft mb-3">Tabuleiro 6×6, movimento de cavalo, vitória por L‑tetromino.</p>
      <div class="d-flex flex-wrap gap-2">
        <span class="badge rounded-pill badge-soft">🦄 começa</span>
        <span class="badge rounded-pill badge-soft">sem captura</span>
        <span class="badge rounded-pill badge-soft">destino vazio obrigatório</span>
        <span class="badge rounded-pill badge-soft">undo 1×</span>
      </div>
    </section>

    <section class="glass p-3 p-md-4 mb-3">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <label for="mode" class="mb-0">Modo:</label>
        <select id="mode" class="form-select form-select-sm w-auto">
          <option value="pvp">🧑 vs 🧑</option>
          <option value="pvb-easy">🧑 vs 🤖 (fácil)</option>
          <option value="pvb-medium">🧑 vs 🤖 (médio)</option>
          <option value="pvb-hard">🧑 vs 🤖 (difícil)</option>
          <option value="bvb">🤖 vs 🤖</option>
        </select>
        <button id="new-game" class="btn btn-sm btn-theme">Novo jogo</button>
        <button id="undo" class="btn btn-sm btn-undo">Desfazer (1×)</button>
      </div>
      <div id="status" class="status mt-3 text-soft"></div>
    </section>

    <section class="row g-3">
      <div class="col-12 col-lg-5">
        <div class="glass p-2 p-md-3">
          <div id="board" class="board-grid"></div>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <div class="glass p-3 p-md-4 h-100">
          <h2 class="h6 text-uppercase text-soft mb-3">Histórico</h2>
          <ol id="history" class="history"></ol>
          <p class="small text-soft mt-3 mb-0">Clique numa peça sua para ver destinos válidos e clique no destino para mover.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="./matunga.js"></script>
</body>
</html>
