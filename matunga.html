<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matunga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #121212;
      --graphite: #1e1e1e;
      --graphite-2: #2a2a2a;
      --brown: #2b1f1a;
      --brown-2: #3a2a24;
      --green: #0f3d2e;
      --green-2: #145c43;
      --red: #5a1a1a;
      --red-2: #7a1f1f;
      --txt: #ddd5cf;
      --txt-soft: #a99a92;
      --win: #9ac9ae;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.46);
      --mx: 0;
      --my: 0;
      --tilt: 0;
      --scroll-energy: 0;
      --pulse: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--txt);
      font-family: "Inter", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.03), transparent 42%),
        radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.52), transparent 45%);
      mix-blend-mode: screen;
    }

    #bg-system {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.95;
    }

    #arena {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 2.3vw, 34px);
      perspective: 1450px;
      transform-style: preserve-3d;
    }

    #brand-title {
      position: absolute;
      top: clamp(12px, 3vw, 34px);
      left: clamp(18px, 4vw, 56px);
      margin: 0;
      font-family: "Orbitron", "Inter", sans-serif;
      font-size: clamp(1.5rem, 4vw, 3rem);
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: #c9c2bd;
      text-shadow:
        0 0 14px rgba(20, 92, 67, 0.25),
        0 0 22px rgba(122, 31, 31, 0.18);
      transform: translate3d(calc(var(--mx) * 22px), calc(var(--my) * 18px), 60px) rotateZ(calc(var(--mx) * 2deg));
      transition: transform 220ms ease-out;
      pointer-events: none;
      user-select: none;
    }

    #brand-title::after {
      content: "MATUNGA";
      position: absolute;
      inset: 0;
      color: rgba(120, 164, 142, 0.24);
      transform: translate(calc(var(--mx) * -12px), calc(var(--my) * -8px));
      filter: blur(0.7px);
      pointer-events: none;
    }

    #stage {
      width: min(1180px, 96vw);
      min-height: min(760px, 92vh);
      display: grid;
      grid-template-columns: 1fr minmax(280px, 0.56fr);
      gap: clamp(12px, 2vw, 26px);
      align-items: center;
      transform-style: preserve-3d;
      transform:
        translate3d(calc(var(--mx) * 22px), calc(var(--my) * 20px), 0)
        rotateX(calc(2deg + var(--scroll-energy) * 4deg))
        rotateY(calc(var(--mx) * -9deg))
        rotateZ(calc(var(--tilt) * 1deg));
      transition: transform 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    #board-3d {
      position: relative;
      min-height: 580px;
      border-radius: 26px;
      border: 1px solid rgba(148, 122, 108, 0.42);
      background:
        linear-gradient(145deg, rgba(30, 30, 30, 0.84), rgba(43, 31, 26, 0.76)),
        radial-gradient(circle at 12% 10%, rgba(20, 92, 67, 0.22), transparent 52%),
        radial-gradient(circle at 88% 85%, rgba(122, 31, 31, 0.18), transparent 44%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      transform-style: preserve-3d;
      clip-path: polygon(0 3%, 100% 0, 98% 100%, 3% 97%);
      isolation: isolate;
      overflow: hidden;
    }

    #board-3d::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, rgba(255, 255, 255, 0.03), transparent 24%),
        linear-gradient(290deg, rgba(255, 255, 255, 0.03), transparent 20%);
      pointer-events: none;
    }

    #board {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(74vw, 520px);
      max-width: 520px;
      transform-style: preserve-3d;
      transform:
        translate3d(-50%, -50%, 38px)
        rotateX(17deg)
        rotateZ(calc(var(--tilt) * -0.8deg));
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(176, 142, 123, 0.52);
      background:
        linear-gradient(170deg, rgba(58, 42, 36, 0.94), rgba(42, 42, 42, 0.92)),
        radial-gradient(circle at 20% 15%, rgba(20, 92, 67, 0.17), transparent 58%);
      box-shadow:
        0 22px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .slot {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(142, 115, 99, 0.54);
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(58, 42, 36, 0.95), rgba(43, 31, 26, 0.95));
      color: #d6ccc6;
      font-size: clamp(0.98rem, 2.8vw, 1.5rem);
      display: grid;
      place-items: center;
      cursor: pointer;
      transform-style: preserve-3d;
      transform:
        translate3d(0, 0, calc(var(--force, 0) * 18px))
        skewX(calc(var(--fx, 0) * 5deg))
        skewY(calc(var(--fy, 0) * -5deg))
        scale(calc(1 + var(--force, 0) * 0.08));
      transition:
        transform 170ms cubic-bezier(0.2, 0.7, 0.3, 1),
        box-shadow 180ms ease,
        border-color 180ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .slot:hover {
      border-color: rgba(182, 151, 133, 0.88);
      box-shadow:
        0 0 0 1px rgba(182, 151, 133, 0.36),
        0 10px 18px rgba(0, 0, 0, 0.34);
    }

    .slot.unicorn {
      color: #d7cabd;
      background:
        linear-gradient(180deg, rgba(78, 56, 46, 0.98), rgba(54, 41, 35, 0.98)),
        radial-gradient(circle at 50% 12%, rgba(201, 160, 130, 0.24), transparent 58%);
      border-color: rgba(190, 152, 126, 0.64);
    }

    .slot.horse {
      color: #b8d4c6;
      background:
        linear-gradient(180deg, rgba(24, 62, 48, 0.97), rgba(15, 46, 35, 0.97)),
        radial-gradient(circle at 50% 12%, rgba(121, 179, 151, 0.24), transparent 58%);
      border-color: rgba(121, 179, 151, 0.66);
    }

    .slot.selected {
      box-shadow:
        0 0 0 2px rgba(121, 179, 151, 0.45),
        0 0 20px rgba(20, 92, 67, 0.34);
    }

    .slot.valid {
      border-color: rgba(159, 205, 173, 0.95);
      box-shadow:
        0 0 0 1px rgba(159, 205, 173, 0.5),
        0 0 18px rgba(20, 92, 67, 0.38);
    }

    .slot.winning {
      border-color: rgba(159, 205, 173, 0.95);
      animation: winPulse 1s infinite;
      box-shadow:
        0 0 0 1px rgba(159, 205, 173, 0.5),
        0 0 24px rgba(159, 205, 173, 0.52);
    }

    .slot .rc {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-size: 8px;
      letter-spacing: 0.06em;
      color: rgba(173, 155, 145, 0.62);
      pointer-events: none;
    }

    #ui-overlay {
      position: absolute;
      right: clamp(10px, 2vw, 24px);
      top: clamp(10px, 2vw, 24px);
      z-index: 30;
      display: grid;
      gap: 8px;
      width: min(320px, 44vw);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 122, 108, 0.46);
      background: linear-gradient(170deg, rgba(26, 26, 26, 0.82), rgba(43, 31, 26, 0.74));
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
      transform: translateZ(40px) rotateZ(-1deg);
    }

    .hud-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hud-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--txt-soft);
    }

    .hud-select,
    .hud-btn {
      border: 1px solid rgba(150, 122, 108, 0.52);
      background: linear-gradient(180deg, rgba(42, 42, 42, 0.95), rgba(43, 31, 26, 0.92));
      color: var(--txt);
      border-radius: 9px;
      height: 34px;
      padding: 0 10px;
      font-size: 0.84rem;
      transition: transform 180ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }

    .hud-btn {
      cursor: pointer;
    }

    .hud-btn:hover {
      transform: scale(1.04);
      border-color: rgba(121, 179, 151, 0.85);
      box-shadow: 0 0 16px rgba(20, 92, 67, 0.38);
    }

    .hud-btn.alert:hover {
      border-color: rgba(201, 130, 130, 0.86);
      box-shadow: 0 0 16px rgba(122, 31, 31, 0.34);
    }

    .hud-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #info-layer {
      position: relative;
      min-height: 560px;
      padding: 16px 14px;
      border-radius: 19px;
      border: 1px solid rgba(148, 122, 108, 0.4);
      background:
        linear-gradient(165deg, rgba(30, 30, 30, 0.9), rgba(43, 31, 26, 0.82)),
        radial-gradient(circle at 80% 10%, rgba(122, 31, 31, 0.18), transparent 42%);
      box-shadow: var(--shadow);
      transform: translate3d(0, 0, 24px) rotateZ(0.9deg);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }

    #status {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--txt-soft);
      min-height: 54px;
    }

    #status .u { color: #d3bba3; }
    #status .h { color: #8ab89f; }
    #status .ok { color: #9ac9ae; }
    #status .warn { color: #c98282; }

    #legend {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: var(--txt-soft);
    }

    #legend span {
      border: 1px solid rgba(148, 122, 108, 0.44);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(42, 42, 42, 0.7);
    }

    #history {
      margin: 0;
      padding-left: 18px;
      overflow: auto;
      max-height: 430px;
      color: #b6a69c;
      line-height: 1.55;
      font-size: 0.9rem;
    }

    #history li strong { color: #dfd5ce; }

    #history::-webkit-scrollbar { width: 8px; }
    #history::-webkit-scrollbar-thumb {
      border-radius: 8px;
      background: linear-gradient(180deg, #5a1a1a, #145c43);
    }

    #hint {
      margin: 0;
      font-size: 0.78rem;
      color: #968880;
      line-height: 1.5;
      border-top: 1px dashed rgba(148, 122, 108, 0.3);
      padding-top: 8px;
    }

    @keyframes winPulse {
      0%, 100% { transform: translate3d(0, 0, calc(var(--force, 0) * 18px)) scale(1); }
      50% { transform: translate3d(0, -2px, calc(var(--force, 0) * 24px)) scale(1.035); }
    }

    @media (max-width: 980px) {
      #stage {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      #board-3d { min-height: 500px; }
      #ui-overlay {
        position: static;
        width: 100%;
        margin-bottom: 10px;
        transform: translateZ(0);
      }
      #board {
        width: min(86vw, 520px);
      }
      #info-layer {
        min-height: 300px;
        transform: none;
      }
      #brand-title {
        font-size: clamp(1.3rem, 9vw, 2.2rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
      #stage,
      #board,
      #brand-title {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-system"></canvas>

  <div id="arena">
    <h1 id="brand-title">Matunga</h1>

    <section id="stage">
      <div id="board-3d">
        <div id="ui-overlay">
          <div class="hud-row">
            <span class="hud-label">Modo</span>
            <select id="mode" class="hud-select">
              <option value="pvp">🧑 vs 🧑</option>
              <option value="pvb-easy">🧑 vs 🤖 (fácil)</option>
              <option value="pvb-medium">🧑 vs 🤖 (médio)</option>
              <option value="pvb-hard">🧑 vs 🤖 (difícil)</option>
              <option value="bvb">🤖 vs 🤖</option>
            </select>
          </div>
          <div class="hud-row">
            <button id="new-game" class="hud-btn">Novo Jogo</button>
            <button id="undo" class="hud-btn alert">Desfazer 1×</button>
          </div>
        </div>
        <div id="board" aria-label="Tabuleiro Matunga"></div>
      </div>

      <aside id="info-layer">
        <div id="status"></div>
        <div id="legend">
          <span>6×6</span>
          <span>Sem captura</span>
          <span>Vitória em L</span>
          <span>Força no hover</span>
        </div>
        <ol id="history"></ol>
        <p id="hint">Passe o cursor pelo tabuleiro para ativar o campo de força visual. Clique em uma peça sua e depois no destino válido.</p>
      </aside>
    </section>
  </div>

  <script src="./matunga.js"></script>
</body>
</html>
